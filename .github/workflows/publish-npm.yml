# Publishes js/ to npm as `flightpowers` when a GitHub release is published.
#
# Auth: npm trusted publishing (OIDC, no token). The trusted publisher on
# npmjs.com names this repo and this workflow file (publish-npm.yml), set
# 2026-11-08 after 0.1.0 was published by hand. No npm token is stored or
# passed: an empty NODE_AUTH_TOKEN is left out so only OIDC is in play.
#
# Release only: no workflow_dispatch (a hand run from a branch would publish
# unreviewed code under a permanent version). The `npm` environment only
# accepts tags matching v*.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/flightpowers
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1 && npm --version
      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match js/package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public --loglevel silly
      # Diagnostics for the trusted-publishing (OIDC) exchange. Runs only when
      # a step failed. Prints only the debug-log lines about OIDC / the id-token
      # request / the token exchange, with anything token-shaped masked again
      # (npm already redacts tokens; this is a second guard).
      - name: OIDC diagnostics (on failure only)
        if: failure()
        run: |
          set -o pipefail
          shopt -s nullglob
          logs=("$HOME"/.npm/_logs/*-debug-0.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "no npm debug log found"
            exit 0
          fi
          for f in "${logs[@]}"; do
            echo "== $(basename "$f")"
            grep -i -E 'oidc|id-token|id_token|idtoken|trusted|exchange|audience' "$f" \
              | sed -E \
                  -e 's/eyJ[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*/[MASKED]/g' \
                  -e 's/npm_[A-Za-z0-9]+/[MASKED]/g' \
                  -e 's/(Bearer|Basic)[[:space:]]+[^[:space:]"]+/\1 [MASKED]/gI' \
                  -e 's/[A-Za-z0-9+_=-]{32,}/[MASKED]/g' \
              || echo "(no matching lines)"
          done
